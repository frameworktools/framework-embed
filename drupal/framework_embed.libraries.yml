# Copies of php/assets, refreshed by `make drupal` (the module serves them from its own directory).
framework_embed:
  css:
    theme:
      assets/framework-embed.css: {}

# Draws Vega-Lite charts and opens variable tips on hover beside their term.
# Attached only when a rendered artifact contains a chart or a tip.
chart:
  js:
    assets/framework-embed.iife.js: { attributes: { defer: true } }
  dependencies:
    - framework_embed/framework_embed
