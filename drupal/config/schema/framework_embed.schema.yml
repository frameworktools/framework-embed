framework_embed.settings:
  type: config_object
  label: 'Framework embed settings'
  mapping:
    hosts:
      type: sequence
      label: 'Extra allowed hosts'
      sequence:
        type: string
        label: 'Host name or origin'
    max_ttl:
      type: integer
      label: 'Maximum cache lifetime in seconds'
    takedown:
      type: boolean
      label: 'Remove stored copies of deleted or restricted artifacts'
